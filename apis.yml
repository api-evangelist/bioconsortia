aid: bioconsortia
name: BioConsortia
description: 'BioConsortia, Inc. is an agricultural biotechnology company headquartered in Davis,
  California, with additional laboratories in New Zealand, that discovers and commercializes microbial
  biologicals for row crops and specialty agriculture. Its patented Advanced Microbial Selection (AMS)
  process, RhizoViz microbe-visualization tool and GenePro genomics and gene-engineering platform are
  used to screen a collection of more than 60,000 characterized microorganisms — including roughly
  9,000 endophytes — into nitrogen-fixation biofertilizers, biocontrol products (bionematicides and
  biofungicides) and biostimulants, largely delivered as seed treatments. The company sells physical
  crop inputs through partners such as Mosaic, Nichino America and Envu; its platform technologies are
  internal R&D instruments rather than commercial software, and BioConsortia publishes no public API,
  developer portal, SDK or machine-readable specification.'
